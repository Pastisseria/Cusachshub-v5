name: Corregir visitadores y presupuestos

on:
  push:
    paths:
      - '.github/workflows/corregir-visitadores-presupuestos.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Corregir ficha visitador y visor presupuesto
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Ficha de visitador: unir presupuestos por cliente_id y por nombre del visitador.
          p = Path('src/pages/fichavisitador.jsx')
          s = p.read_text(encoding='utf-8')

          patron = re.compile(r'  async function cargarPedidos\(datosVisitador\) \{.*?\n  \}\n\n  useEffect\(\(\) => \{', re.S)
          reemplazo = '''  async function cargarPedidos(datosVisitador) {
    setCargandoPedidos(true);

    try {
      const normalizar = (valor = "") =>
        String(valor)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\\u0300-\\u036f]/g, "")
          .replace(/\\s+/g, " ")
          .trim();

      const nombreCompleto = [
        datosVisitador?.nombre,
        datosVisitador?.apellidos,
      ]
        .filter(Boolean)
        .join(" ")
        .trim();

      const { data: clientesData, error: clientesError } = await supabase
        .from("clientes")
        .select("*");

      if (clientesError) throw clientesError;

      const candidatos = [
        datosVisitador?.nombre,
        nombreCompleto,
        datosVisitador?.email,
        datosVisitador?.telefono,
        datosVisitador?.movil,
      ]
        .filter(Boolean)
        .map(normalizar);

      const clienteIds = new Set();
      if (datosVisitador?.cliente_id) {
        clienteIds.add(String(datosVisitador.cliente_id));
      }

      (clientesData || []).forEach((cliente) => {
        const valoresCliente = [
          cliente.nombre,
          cliente.empresa,
          cliente.nombre_comercial,
          cliente.razon_social,
          cliente.email,
          cliente.telefono,
          cliente.movil,
          cliente.nif_cif,
          cliente.nif,
          cliente.cif,
        ]
          .filter(Boolean)
          .map(normalizar);

        const coincide = candidatos.some((candidato) =>
          valoresCliente.some((valor) =>
            valor === candidato ||
            (candidato.length >= 5 && valor.includes(candidato)) ||
            (valor.length >= 5 && candidato.includes(valor)),
          ),
        );

        if (coincide && cliente.id) clienteIds.add(String(cliente.id));
      });

      const { data, error: supabaseError } = await supabase
        .from("presupuestos")
        .select("*")
        .order("created_at", { ascending: false });

      if (supabaseError) throw supabaseError;

      const nombresVisitador = [nombreCompleto, datosVisitador?.nombre]
        .filter(Boolean)
        .map(normalizar);

      const unificados = (data || []).filter((pedido) => {
        const porCliente =
          pedido.cliente_id && clienteIds.has(String(pedido.cliente_id));

        const nombreGuardado = normalizar(pedido.visitador_nombre || "");
        const porVisitador =
          pedido.tipo_documento === "Visitador médico" &&
          nombresVisitador.some((nombre) =>
            nombreGuardado === nombre ||
            (nombre.length >= 5 && nombreGuardado.includes(nombre)) ||
            (nombreGuardado.length >= 5 && nombre.includes(nombreGuardado)),
          );

        return porCliente || porVisitador;
      });

      const vistos = new Set();
      setPedidos(
        unificados.filter((pedido) => {
          const clave = String(pedido.id);
          if (vistos.has(clave)) return false;
          vistos.add(clave);
          return true;
        }),
      );
    } catch (err) {
      console.error("No se han podido cargar los pedidos:", err);
      setPedidos([]);
    } finally {
      setCargandoPedidos(false);
    }
  }

  useEffect(() => {'''

          s2, n = patron.subn(reemplazo, s, count=1)
          if n != 1:
              raise SystemExit('No se pudo actualizar cargarPedidos en fichavisitador.jsx')
          p.write_text(s2, encoding='utf-8')

          # 2) Visor del presupuesto: para Visitador médico mostrar datos reales del cliente vinculado.
          p = Path('src/components/DocumentoEditor.jsx')
          s = p.read_text(encoding='utf-8')

          viejo_nombre = '''                  {documentoAbierto.tipo_documento === "Visitador médico"
                    ? documentoAbierto.visitador_nombre || "—"
                    : documentoAbierto.clientes?.empresa ||
                      documentoAbierto.clientes?.nombre ||
                      "Cliente"}'''

          nuevo_nombre = '''                  {documentoAbierto.clientes?.empresa ||
                    documentoAbierto.clientes?.nombre ||
                    documentoAbierto.visitador_nombre ||
                    "Cliente"}'''

          if viejo_nombre not in s:
              raise SystemExit('No se encontró el bloque de nombre del cliente en DocumentoEditor.jsx')
          s = s.replace(viejo_nombre, nuevo_nombre, 1)

          patron_extra = re.compile(r'''\n            \{documentoAbierto\.tipo_documento === "Visitador médico" && \(\n              <section className="presupuesto-print-bloque-extra">.*?\n              </section>\n            \)\}\n''', re.S)

          nuevo_extra = '''
            {documentoAbierto.tipo_documento === "Visitador médico" &&
              documentoAbierto.clientes && (
                <section className="presupuesto-print-bloque-extra">
                  {documentoAbierto.clientes.nif_cif && (
                    <p>
                      <strong>NIF / CIF:</strong>{" "}
                      {documentoAbierto.clientes.nif_cif}
                    </p>
                  )}

                  {documentoAbierto.clientes.direccion && (
                    <p>
                      <strong>Dirección:</strong>{" "}
                      {[
                        documentoAbierto.clientes.direccion,
                        documentoAbierto.clientes.codigo_postal,
                        documentoAbierto.clientes.poblacion,
                        documentoAbierto.clientes.provincia,
                      ]
                        .filter(Boolean)
                        .join(" · ")}
                    </p>
                  )}

                  {documentoAbierto.clientes.email && (
                    <p>
                      <strong>Email:</strong>{" "}
                      {documentoAbierto.clientes.email}
                    </p>
                  )}
                </section>
              )}
'''

          s2, n = patron_extra.subn(nuevo_extra, s, count=1)
          if n != 1:
              raise SystemExit('No se encontró el bloque Laboratorio/Centro médico en DocumentoEditor.jsx')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Eliminar workflow temporal
        run: rm .github/workflows/corregir-visitadores-presupuestos.yml

      - name: Guardar cambios
        run: |
          git config user.name "Cusachs Hub"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/fichavisitador.jsx src/components/DocumentoEditor.jsx .github/workflows/corregir-visitadores-presupuestos.yml
          git commit -m "Corregir presupuestos y datos de visitadores"
          git push origin main
